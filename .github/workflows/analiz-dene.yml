name: Analiz denemesi
on:
  workflow_dispatch:
  push:
    branches: [analiz-dene]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: node bot/analiz-dene.js
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f analiz-sonuc.txt; git commit -qm "analiz sonucu [skip ci]"; git push origin HEAD:analiz-dene
