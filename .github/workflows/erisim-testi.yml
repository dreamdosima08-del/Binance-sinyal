name: Erisim testi
on:
  push:
    branches: [bot-erisim-testi]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Binance erisimi
        run: |
          {
            echo "zaman: $(date -u)"
            node --version
            for u in "https://data-api.binance.vision/api/v3/ping" \
                     "https://data-api.binance.vision/api/v3/klines?symbol=BTCTRY&interval=4h&limit=2" \
                     "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=4h&limit=2" \
                     "https://api.binance.com/api/v3/ping" \
                     "https://api.telegram.org/"; do
              code=$(curl -s -o /tmp/b -w "%{http_code}" -m 20 "$u"); echo "$code $u $(head -c 160 /tmp/b)"
            done
          } > erisim-sonucu.txt 2>&1
          cat erisim-sonucu.txt
      - name: Sonucu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add erisim-sonucu.txt
          git commit -m "erisim testi sonucu [skip ci]"
          git push
