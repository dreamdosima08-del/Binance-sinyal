name: BIST veri denemesi
on:
  push:
    branches: [bist-dene]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: node bot/bist-dene.js
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f bist-sonuc.txt bist-arastirma.json.gz || true; git commit -qm "bist sonucu [skip ci]"; git push origin HEAD:bist-dene
