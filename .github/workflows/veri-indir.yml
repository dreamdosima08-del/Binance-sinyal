name: Arastirma verisi indir
on:
  workflow_dispatch:
  push:
    branches: [veri-indir-calistir]
permissions:
  contents: write
concurrency:
  group: veri-indir
  cancel-in-progress: true
jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: İndir
        env:
          SONUC_DIR: ${{ github.workspace }}/arastirma
          GUN: "760"
        run: node bot/veri-indir.js
      - name: Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898+github-actions[bot]@users.noreply.github.com"
          cd arastirma
          ls -la
          git init -q -b arastirma-veri
          git add -A
          git commit -q -m "Araştırma verisi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" arastirma-veri
