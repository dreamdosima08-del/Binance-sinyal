name: Borsa İstanbul verisi
# Gün sonu verileri: hafta içi 18:50 ve 20:20 (Türkiye), ertesi sabah 09:10'da bir kez daha (geç gelen düzeltmeler için).
on:
  schedule:
    - cron: "50 15 * * 1-5"
    - cron: "20 17 * * 1-5"
    - cron: "10 6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/bist-veri.js", ".github/workflows/bist-veri.yml"]
permissions:
  contents: write
concurrency:
  group: bist-veri
  cancel-in-progress: false
jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Önceki veriyi al
        run: |
          git clone -q --depth 1 --branch bist-veri "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bv || mkdir -p bv
          rm -rf bv/.git
      - name: İndir ve özetle
        env:
          VERI_DIR: ${{ github.workspace }}/bv
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node bot/bist-veri.js
      - name: Kaydet (geçmişsiz, tek kayıt)
        run: |
          cd bv
          git init -q && git checkout -q -b bist-veri
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "BIST verisi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bist-veri
